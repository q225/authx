version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: authx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authx_user
      POSTGRES_PASSWORD: authx_pass
      POSTGRES_DB: authx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authx_user -d authx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authx_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://authx_user:authx_pass@postgres:5432/authx_db?schema=public
      JWT_ACCESS_SECRET: change-this-access-secret-min-32-chars
      JWT_REFRESH_SECRET: change-this-refresh-secret-min-32-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: strict
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
